<!DOCTYPE html>
<html>
    <head>
        <title>Web Development Quiz</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="quiz-card">
            <div class="quiz-header">
                <span class="category">HTML & CSS Quiz</span>
                <span class="question-count">Question 1 of 5</span>
            </div>

            <h2 class="question">What does HTML stand for?</h2>

            <form class="options">
                <label class="option">
                    <input type="radio" name="answer" value="a">
                    <span>Hyper Text Markup Language</span>
                </label>

                <label class="option">
                    <input type="radio" name="answer" value="b">
                    <span>High Text Machine Language</span>
                </label>

                <label class="option">
                    <input type="radio" name="answer" value="c">
                    <span>Hyperlink and Text Markup Language</span>
                </label>

                <label class="option">
                    <input type="radio" name="answer" value="d">
                    <span>Home Tool Markup Language</span>
                </label>
            </form>

            <div class="quiz-footer">
                <button class="next-btn">Next Question</button>
            </div>
        </div>

    </body>
</html>
